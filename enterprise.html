<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glam Chic Enterprise | لوحة التحكم الشاملة</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --gold-color: #d4af37;
            --bg-color: #f8f9fa;
            --sidebar-width: 250px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: #333; display: flex; height: 100vh; overflow: hidden; position: relative; }
        
        /* شاشة تسجيل الدخول الآمنة */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 2000; padding: 15px;
        }
        .login-card {
            background: #fff; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center;
        }
        .login-card h2 { margin-bottom: 10px; color: var(--primary-color); }
        .login-card p { margin-bottom: 20px; font-size: 13px; color: #666; }
        .login-card input, .login-card textarea {
            width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;
        }
        .login-card label { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; font-size: 14px; cursor: pointer; justify-content: right; }
        .login-card button {
            width: 100%; padding: 12px; background: var(--gold-color); color: #fff; border: none; border-radius: 6px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s;
        }
        .login-card button:hover { background: #b3922b; }
        .error-msg { color: var(--accent-color); font-size: 13px; margin-bottom: 10px; display: none; }

        /* القائمة الجانبية المتجاوبة */
        .sidebar {
            width: var(--sidebar-width); background: var(--primary-color); color: #fff; display: flex; flex-direction: column; justify-content: space-between;
            transition: transform 0.3s ease; z-index: 1000; flex-shrink: 0;
        }
        .sidebar-header { padding: 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h1 { font-size: 18px; color: var(--gold-color); }
        .sidebar-menu { list-style: none; padding: 10px 0; flex-grow: 1; overflow-y: auto; }
        .sidebar-menu li { padding: 12px 15px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .sidebar-menu li:hover, .sidebar-menu li.active { background: rgba(255,255,255,0.1); border-right: 4px solid var(--gold-color); }
        .sidebar-footer { padding: 12px 15px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 13px; text-align: center; }

        /* طبقة عتمة الخلفية لإغلاق القائمة عند النقر خارجها */
        #sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 999;
        }
        #sidebar-overlay.active { display: block; }

        /* زر إظهار/إخفاء القائمة في الموبايل */
        .menu-toggle {
            display: none; background: var(--primary-color); color: #fff; border: none; padding: 8px 12px; font-size: 18px; cursor: pointer; border-radius: 4px;
        }

        /* المحتوى الرئيسي */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; width: calc(100% - var(--sidebar-width)); }
        .top-bar { height: 55px; background: #fff; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; flex-shrink: 0; }
        .top-bar h3 { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
        .workspace { flex-grow: 1; padding: 10px; overflow-y: auto; background: var(--bg-color); }
        iframe { width: 100%; height: 100%; border: none; border-radius: 6px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .logout-btn { background: #e74c3c; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; width: 100%; }

        /* تحسين العرض على الشاشات الصغيرة (الهواتف) */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar {
                position: fixed; height: 100%; right: -250px; top: 0; transition: right 0.3s ease;
            }
            .sidebar.mobile-open { right: 0; }
            .main-content { width: 100%; height: 100vh; }
            .menu-toggle { display: inline-block; }
        }
    </style>
</head>
<body>

    <!-- طبقة لإغلاق القائمة عند النقر خارجها في الجوال -->
    <div id="sidebar-overlay" onclick="toggleMobileMenu()"></div>

    <!-- شاشة تسجيل الدخول الآمنة -->
    <div id="login-screen">
        <div class="login-card">
            <h2>Glam Chic Enterprise</h2>
            <p>منطقة إدارية آمنة ومحمية</p>
            <div id="error-alert" class="error-msg">كلمة المرور غير صحيحة!</div>
            <input type="password" id="master-password" placeholder="أدخل كلمة مرور المخزون (glame2026)">
            <textarea id="api-token" rows="3" placeholder="مفتاح الـ Token أو بيانات المصادقة (اختياري)"></textarea>
            <label>
                <input type="checkbox" id="remember-me" checked> تذكرني على هذا الجهاز
            </label>
            <button onclick="handleLogin()">دخول آمن 🚀</button>
        </div>
    </div>

    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar">
        <div>
            <div class="sidebar-header">
                <h1>GLAME CHIC</h1>
                <p style="font-size: 10px; color: #aaa; margin-top: 3px;">Enterprise Suite</p>
            </div>
            <ul class="sidebar-menu">
                <li onclick="switchTab('command')" id="menu-command" class="active">📦 لوحة الطلبيات</li>
                <li onclick="switchTab('admin')" id="menu-admin">⚙️ لوحة الإدارة</li>
                <li onclick="switchTab('stats')" id="menu-stats">📊 لوحة الإحصائيات</li>
                <li onclick="switchTab('control')" id="menu-control">📋 إدارة المخزون</li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="handleLogout()">إقفال وخروج 🔒</button>
        </div>
    </div>

    <!-- المحتوى وعرض الصفحات -->
    <div class="main-content">
        <div class="top-bar">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="menu-toggle" onclick="toggleMobileMenu()">☰</button>
                <h3 id="current-title">لوحة الطلبيات</h3>
            </div>
            <span style="font-size: 12px; color: #27ae60;">● محمي محلياً</span>
        </div>
        <div class="workspace">
            <iframe id="content-frame" src="command.html"></iframe>
        </div>
    </div>

    <script>
        let currentStoredToken = '';

        window.addEventListener('DOMContentLoaded', () => {
            const savedSession = localStorage.getItem('glame_enterprise_auth');
            const savedToken = localStorage.getItem('glame_api_token');
            
            if (savedSession === 'active') {
                document.getElementById('login-screen').style.display = 'none';
                if (savedToken) {
                    currentStoredToken = savedToken;
                    document.getElementById('api-token').value = savedToken;
                }
            }
        });

        function handleLogin() {
            const pass = document.getElementById('master-password').value;
            const token = document.getElementById('api-token').value;
            const remember = document.getElementById('remember-me').checked;
            const errorAlert = document.getElementById('error-alert');

            // التحقق من كلمة المرور الخاصة بالمخزون
            if (pass === 'glame2026') {
                errorAlert.style.display = 'none';
                currentStoredToken = token;
                if (remember) {
                    localStorage.setItem('glame_enterprise_auth', 'active');
                    if(token) {
                        localStorage.setItem('glame_api_token', token);
                    }
                }
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('master-password').value = '';
            } else {
                errorAlert.style.display = 'block';
            }
        }

        function handleLogout() {
            localStorage.removeItem('glame_enterprise_auth');
            localStorage.removeItem('glame_api_token');
            location.reload();
        }

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('mobile-open');
            overlay.classList.toggle('active');
        }

        function switchTab(tab) {
            document.querySelectorAll('.sidebar-menu li').forEach(el => el.classList.remove('active'));
            
            const frame = document.getElementById('content-frame');
            const title = document.getElementById('current-title');

            if (tab === 'command') {
                frame.src = 'command.html';
                title.innerText = 'لوحة الطلبيات';
                document.getElementById('menu-command').classList.add('active');
            } else if (tab === 'admin') {
                frame.src = 'admin.html';
                title.innerText = 'لوحة الإدارة';
                document.getElementById('menu-admin').classList.add('active');
            } else if (tab === 'stats') {
                frame.src = 'stats.html';
                title.innerText = 'لوحة الإحصائيات';
                document.getElementById('menu-stats').classList.add('active');
            } else if (tab === 'control') {
                frame.src = 'control.html';
                title.innerText = 'إدارة المخزون';
                document.getElementById('menu-control').classList.add('active');
            }

            // إغلاق القائمة في الجوال تلقائياً عند اختيار أي قسم
            if(window.innerWidth <= 768) {
                toggleMobileMenu();
            }
        }
    </script>
</body>
</html>
