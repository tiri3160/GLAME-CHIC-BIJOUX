<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glam Chic - مجوهرات وإكسسوارات ضد الصدأ</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #faf8f5; margin: 0; padding: 0; text-align: right; }
        header { background: #fff; padding: 25px 20px; border-bottom: 3px solid #d4af37; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h1 { color: #b8860b; margin: 0; font-size: 28px; letter-spacing: 1px; }
        header p { color: #666; margin-top: 8px; font-size: 15px; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 15px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .product-card { background: #fff; border-radius: 10px; padding: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.04); text-align: center; border: 1px solid #eee; }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; background: #f0f0f0; }
        .badge { display: inline-block; background: #e6f4ea; color: #137333; font-size: 11px; padding: 3px 8px; border-radius: 4px; margin: 10px 0 5px; font-weight: bold; }
        .product-card h3 { font-size: 17px; margin: 5px 0; color: #333; }
        .product-card p.price { color: #b8860b; font-weight: bold; font-size: 17px; margin: 8px 0 15px; }
        .order-btn { background: #25d366; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 15px; font-weight: bold; text-decoration: none; display: inline-block; box-sizing: border-box; }
        .order-btn:hover { background: #1ebe5d; }
        footer { text-align: center; padding: 20px; color: #886; margin-top: 50px; font-size: 14px; border-top: 1px solid #eee; }
    </style>
</head>
<body>

    <header>
        <h1>Glam Chic</h1>
        <p>أرقى المجوهرات والإكسسوارات المصنوعة من الفولاذ المقاوم للصدأ (Stainless Steel) - لا تغير لونها مع الماء</p>
    </header>

    <div class="container">
        <div class="products-grid" id="productContainer">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=400" alt="منتج تجريبي">
                <span class="badge">مقاوم للصدأ 100%</span>
                <h3>خاتم أنيق (Inox)</h3>
                <p class="price">1200 دج</p>
                <a href="https://wa.me/213000000000?text=السلام عليكم، أريد طلب هذا المنتج: خاتم أنيق (Inox)" class="order-btn" target="_blank">اطلب الآن عبر واتساب</a>
            </div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © Glam Chic - وهران</p>
    </footer>

</body>
</html>
