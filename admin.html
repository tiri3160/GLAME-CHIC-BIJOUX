<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة المتكاملة | GLAME CHIC</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #D4AF37; margin-bottom: 30px; font-weight: 700; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        
        #login-section { text-align: center; max-width: 400px; margin: 50px auto; }
        input.input-field, select.input-field { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; transition: 0.3s; background: #fafafa; }
        input.input-field:focus, select.input-field:focus { border-color: #D4AF37; outline: none; background: #fff; box-shadow: 0 0 8px rgba(212,175,55,0.2); }
        
        button { background: #111; color: #D4AF37; border: none; padding: 14px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #D4AF37; color: #111; transform: translateY(-2px); }
        
        #dashboard-section { display: none; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .form-group { background: #fafafa; padding: 20px; border-radius: 10px; border: 1px solid #eee; margin-bottom: 30px; }
        
        #statusMessage { text-align: center; font-weight: bold; margin: 15px 0; color: #28a745; font-size: 1.1em; }
        #errorMessage { text-align: center; font-weight: bold; margin: 15px 0; color: #dc3545; }

        .products-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #D4AF37; margin-top: 40px; padding-bottom: 10px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 15px; }
        
        .category-header { grid-column: 1 / -1; background: #111; color: #D4AF37; padding: 12px 20px; margin-top: 25px; border-radius: 8px; font-size: 1.3em; font-weight: bold; display: flex; justify-content: space-between; }
        
        .product-card { background: #fff; border: 1px solid #eee; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.03); transition: 0.3s; display: flex; flex-direction: column; }
        .product-card:hover { border-color: #D4AF37; box-shadow: 0 8px 25px rgba(212,175,55,0.15); }
        
        .product-img { width: 100%; height: 210px; object-fit: contain; background: #f9f9f9; border-bottom: 1px solid #eee; padding: 5px; }
        .product-details { padding: 15px; flex-grow: 1; text-align: center; }
        .product-name { font-size: 1.25em; font-weight: bold; margin: 0 0 5px; color: #111; }
        .product-price { color: #D4AF37; font-size: 1.35em; font-weight: bold; margin-bottom: 5px; }
        .old-price-tag { color: #999; text-decoration: line-through; font-size: 0.9em; margin-left: 8px; }
        .product-stock { color: #666; font-size: 0.9em; margin-bottom: 10px; background: #eee; display: inline-block; padding: 2px 10px; border-radius: 15px; }
        
        .card-actions { display: flex; gap: 10px; padding: 12px 15px; border-top: 1px solid #eee; background: #fafafa; }
        .btn-edit, .btn-delete { flex: 1; padding: 10px; border: none; cursor: pointer; font-weight: bold; font-family: 'Cairo'; transition: 0.3s; border-radius: 6px; margin: 0; }
        .btn-edit { background: #e0f2fe; color: #0284c7; }
        .btn-edit:hover { background: #bae6fd; color: #0369a1; }
        .btn-delete { background: #fee2e2; color: #dc3545; }
        .btn-delete:hover { background: #fecaca; color: #b91c1c; }

        @media(max-width: 600px) {
            .container { padding: 15px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👑 الإدارة المتكاملة | GLAME CHIC</h1>

    <div id="login-section">
        <p>أدخل المفتاح السري (Token) للاتصال بقاعدة بيانات متجرك.</p>
        <input type="text" id="githubUser" class="input-field" value="tiri3160" readonly style="background:#eee; color:#666; cursor:not-allowed;">
        <input type="password" id="githubToken" class="input-field" placeholder="الصق المفتاح السري هنا (ghp_...)" autocomplete="new-password">
        <button onclick="login()">تسجيل الدخول الآمن 🔐</button>
        <div id="loginError" style="color: red; margin-top: 10px; font-weight: bold;"></div>
    </div>

    <div id="dashboard-section">
        <div class="form-group">
            <h2 style="margin-top: 0; color: #111;">➕ إضافة / تعديل منتج</h2>
            <div id="statusMessage"></div>
            <div id="errorMessage"></div>
            
            <div class="form-grid">
                <input type="text" id="prodName" class="input-field" placeholder="اسم المنتج (مثال: أقراط اللؤلؤ الملكية)">
                <select id="prodCategory" class="input-field">
                    <option value="" disabled selected>-- اختر مجموعة المنتج --</option>
                    <option value="أقراط">أقراط 🪞</option>
                    <option value="خواتم">خواتم 💍</option>
                    <option value="أساور">أساور 📿</option>
                    <option value="قلادات">قلادات 💎</option>
                    <option value="أطقم">أطقم كاملة 👑</option>
                    <option value="ساعات">ساعات ⌚</option>
                </select>
            </div>

            <div class="form-grid">
                <input type="number" id="prodPrice" class="input-field" placeholder="السعر الحالي للبيع (د.ج)">
                <input type="number" id="prodOldPrice" class="input-field" placeholder="السعر القديم قبل التخفيض (اختياري)">
                <input type="number" id="prodQuantity" class="input-field" placeholder="الكمية المتوفرة">
            </div>
            
            <p style="font-size: 14px; margin: 10px 0 5px; color: #666; font-weight: bold;">
                صورة المنتج (يتم تحويلها وضغطها تلقائياً بصيغة WebP فائقة الخفة 💎):
            </p>
            <input type="file" id="prodImage" class="input-field" accept="image/png, image/jpeg, image/webp">
            
            <button onclick="saveProduct()" id="saveBtn">حفظ ونشر في الموقع المباشر 🚀</button>
            <button onclick="cancelEdit()" id="cancelBtn" style="display:none; background:#6c757d; color:#fff;">إلغاء التعديل</button>
        </div>

        <div class="products-header">
            <h2 style="margin: 0;">📦 منتجاتك الحالية مرتبة بالفئة</h2>
            <span id="totalProducts" style="background: #111; color: #D4AF37; padding: 5px 15px; border-radius: 20px; font-weight: bold;">0 منتج</span>
        </div>
        
        <div class="products-grid" id="productsContainer">
            <div style="text-align: center; width: 100%; grid-column: 1 / -1; padding: 40px; color: #888;">
                جاري تحميل منتجاتك من قاعدة البيانات... ⏳
            </div>
        </div>
    </div>
</div>

<script>
    const repoName = "GLAME-CHIC-BIJOUX"; 
    let username = "tiri3160"; 
    let token = "";
    let productsSha = "";
    let productsData = [];
    let editingIndex = -1;

    // استرجاع التوكن المحفوظ محلياً تلقائياً عند فتح الصفحة
    window.addEventListener('DOMContentLoaded', () => {
        const savedToken = localStorage.getItem('glame_internal_token');
        if (savedToken) {
            document.getElementById('githubToken').value = savedToken;
            token = savedToken;
            loadProducts();
        }
    });

    function login() {
        token = document.getElementById('githubToken').value.trim();
        if(!token) { document.getElementById('loginError').innerText = "يرجى إدخال المفتاح السري!"; return; }
        localStorage.setItem('glame_internal_token', token);
        document.getElementById('loginError').innerText = "جاري الاتصال...";
        loadProducts();
    }

    async function loadProducts() {
        const url = `https://api.github.com/repos/${username}/${repoName}/contents/products.json`;
        try {
            const response = await fetch(url, { headers: { "Authorization": `token ${token}` } });
            if(response.status === 404) {
                productsData = [];
                await updateGitHubJson("إنشاء قاعدة البيانات");
            } else if (!response.ok) {
                throw new Error("المفتاح السري (Token) غير صحيح أو منتهي الصلاحية.");
            } else {
                const data = await response.json();
                productsSha = data.sha;
                const decodedContent = decodeURIComponent(escape(atob(data.content)));
                productsData = JSON.parse(decodedContent);
            }
            document.getElementById('login-section').style.display = "none";
            document.getElementById('dashboard-section').style.display = "block";
            renderProducts();
        } catch (error) {
            document.getElementById('loginError').innerText = error.message;
        }
    }

    function getFastImageUrl(url, width = 300) {
        if (!url) return 'https://via.placeholder.com/300x300/f4f4f4/D4AF37?text=GLAME+CHIC';
        if (url.startsWith('data:') || url.startsWith('http')) {
            return `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=${width}&output=webp&q=80`;
        }
        const fullUrl = `https://glamechic.com/${url}`;
        return `https://wsrv.nl/?url=${encodeURIComponent(fullUrl)}&w=${width}&output=webp&q=80`;
    }

    function renderProducts() {
        const container = document.getElementById('productsContainer');
        document.getElementById('totalProducts').innerText = productsData.length + " منتج";
        container.innerHTML = "";
        
        if(productsData.length === 0) { 
            container.innerHTML = `<div style="text-align: center; width: 100%; grid-column: 1 / -1; padding: 40px; color: #888;">لا توجد أي منتجات حالياً. أضف منتجك الأول من الأعلى!</div>`; 
            return; 
        }

        const categoriesList = ["أقراط", "خواتم", "أساور", "قلادات", "أطقم", "ساعات", "أخرى"];
        
        categoriesList.forEach(cat => {
            const catProducts = productsData.map((p, i) => ({...p, originalIndex: i}))
                .filter(p => p.category === cat || (!categoriesList.includes(p.category) && cat === "أخرى"));

            if(catProducts.length > 0) {
                container.innerHTML += `
                    <div class="category-header">
                        <span>✨ قسم: ${cat}</span>
                        <span style="background: #D4AF37; color:#111; padding: 0 10px; border-radius: 5px; font-size: 0.8em;">${catProducts.length}</span>
                    </div>
                `;
                
                catProducts.forEach(p => {
                    const imgSrc = getFastImageUrl(p.image, 300);
                    const oldPriceHTML = (p.oldPrice && p.oldPrice > p.price) ? `<span class="old-price-tag">${p.oldPrice} د.ج</span>` : '';
                    
                    container.innerHTML += `
                        <div class="product-card">
                            <img src="${imgSrc}" class="product-img" alt="${p.name}" loading="lazy">
                            <div class="product-details">
                                <h3 class="product-name">${p.name}</h3>
                                <div class="product-price">${oldPriceHTML} ${p.price} د.ج</div>
                                <div class="product-stock">الكمية المتوفرة: <b>${p.quantity}</b></div>
                            </div>
                            <div class="card-actions">
                                <button class="btn-edit" onclick="editProduct(${p.originalIndex})">تعديل ✏️</button>
                                <button class="btn-delete" onclick="deleteProduct(${p.originalIndex})">حذف 🗑️</button>
                            </div>
                        </div>
                    `;
                });
            }
        });
    }

    function editProduct(index) {
        editingIndex = index;
        const p = productsData[index];
        document.getElementById('prodName').value = p.name;
        document.getElementById('prodCategory').value = p.category || "";
        document.getElementById('prodPrice').value = p.price;
        document.getElementById('prodOldPrice').value = p.oldPrice || "";
        document.getElementById('prodQuantity').value = p.quantity;
        
        document.getElementById('saveBtn').innerText = "حفظ التعديلات 🔄";
        document.getElementById('saveBtn').style.background = "#D4AF37";
        document.getElementById('saveBtn').style.color = "#111";
        document.getElementById('cancelBtn').style.display = "block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        editingIndex = -1;
        document.getElementById('prodName').value = "";
        document.getElementById('prodCategory').value = "";
        document.getElementById('prodPrice').value = "";
        document.getElementById('prodOldPrice').value = "";
        document.getElementById('prodQuantity').value = "";
        document.getElementById('prodImage').value = "";
        
        document.getElementById('saveBtn').innerText = "حفظ ونشر في الموقع المباشر 🚀";
        document.getElementById('saveBtn').style.background = "#111";
        document.getElementById('saveBtn').style.color = "#D4AF37";
        document.getElementById('cancelBtn').style.display = "none";
    }

    async function deleteProduct(index) {
        if(!confirm("هل أنت متأكد من حذف هذا المنتج نهائياً من الموقع؟")) return;
        productsData.splice(index, 1);
        await updateGitHubJson("حذف منتج");
    }

    // معالج الصور الذكي لتحويل الضغط الفوري إلى صيغة WebP فائقة الخفة والوضوح
    function processImageToWebP(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 1000; 
                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL('image/webp', 0.82);
                    resolve({ base64: dataUrl.split(',')[1], ext: 'webp' });
                };
                img.onerror = err => reject(err);
            };
            reader.onerror = err => reject(err);
        });
    }

    async function saveProduct() {
        const name = document.getElementById('prodName').value.trim();
        const category = document.getElementById('prodCategory').value;
        const price = document.getElementById('prodPrice').value;
        const oldPrice = document.getElementById('prodOldPrice').value;
        const qty = document.getElementById('prodQuantity').value;
        const imageFile = document.getElementById('prodImage').files[0];

        const status = document.getElementById('statusMessage');
        const errorMsg = document.getElementById('errorMessage');
        status.innerText = ""; errorMsg.innerText = "";

        if(!name || !category || !price || !qty) { errorMsg.innerText = "❌ يرجى تعبئة الخانات الأساسية (الاسم، المجموعة، السعر، الكمية)!"; return; }

        const btn = document.getElementById('saveBtn');
        btn.innerText = "جاري المعالجة والرفع... ⏳"; btn.disabled = true;

        try {
            let imageUrl = "";
            if(editingIndex > -1) imageUrl = productsData[editingIndex].image;

            if(imageFile) {
                status.innerText = "💎 جاري ضغط وتحويل الصورة إلى WebP...";
                const processed = await processImageToWebP(imageFile);
                const imgFileName = "prod_" + Date.now() + "." + processed.ext; 
                
                const imgUrlApi = `https://api.github.com/repos/${username}/${repoName}/contents/${imgFileName}`;
                const imgResponse = await fetch(imgUrlApi, {
                    method: "PUT",
                    headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ message: "رفع صورة منتج WebP", content: processed.base64 })
                });
                if(!imgResponse.ok) throw new Error("فشل في رفع الصورة.");
                imageUrl = imgFileName; 
            } else if (editingIndex === -1) {
                throw new Error("❌ يرجى اختيار صورة للمنتج الجديد!");
            }

            status.innerText = "جاري تحديث قاعدة البيانات...";
            
            const productObj = {
                id: editingIndex > -1 ? productsData[editingIndex].id : Date.now(),
                name: name, 
                category: category, 
                price: parseInt(price), 
                oldPrice: oldPrice ? parseInt(oldPrice) : 0,
                quantity: parseInt(qty), 
                image: imageUrl
            };

            if(editingIndex > -1) {
                productsData[editingIndex] = productObj;
                await updateGitHubJson("تعديل منتج: " + name);
                status.innerText = "✅ تم تعديل المنتج بنجاح!";
            } else {
                productsData.push(productObj);
                await updateGitHubJson("إضافة منتج: " + name);
                status.innerText = "✅ تمت الإضافة بنجاح!";
            }
            
            cancelEdit(); setTimeout(() => { status.innerText = ""; }, 4000);
        } catch(err) {
            errorMsg.innerText = err.message;
        } finally {
            btn.innerText = editingIndex === -1 ? "حفظ ونشر في الموقع المباشر 🚀" : "حفظ التعديلات 🔄";
            btn.disabled = false;
        }
    }

    async function updateGitHubJson(commitMsg) {
        const url = `https://api.github.com/repos/${username}/${repoName}/contents/products.json`;
        const contentStr = JSON.stringify(productsData, null, 2);
        const encodedContent = btoa(unescape(encodeURIComponent(contentStr)));

        const response = await fetch(url, {
            method: "PUT",
            headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: commitMsg, content: encodedContent, sha: productsSha })
        });
        if(!response.ok) throw new Error("فشل في تحديث قاعدة البيانات.");
        
        const data = await response.json();
        productsSha = data.content.sha; 
        renderProducts();
    }
</script>
</body>
</html>
