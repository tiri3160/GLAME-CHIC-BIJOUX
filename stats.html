<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار الإحصائيات (Cloudflare Worker) | GLAME CHIC</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root { --gold: #D4AF37; --gold-light: #FBF5B7; --bg: #070707; --card: #121212; --border: rgba(212,175,55,0.25); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #fff; padding: 20px 15px 60px; }
        .container { max-width: 1150px; margin: 0 auto; }

        .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; background: var(--card); padding: 18px 22px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 22px; }
        .header-title h1 { color: var(--gold); font-size: 1.5em; display: flex; align-items: center; gap: 10px; font-family: 'Amiri', serif; }
        .live-dot { width: 11px; height: 11px; background: #2ecc71; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px #2ecc71; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-action { background: #1e1e1e; color: var(--gold); border: 1px solid var(--gold); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; font-size: 0.9em; display: flex; align-items: center; gap: 6px; transition: 0.2s; text-decoration: none; }
        .btn-action:hover { background: var(--gold); color: #000; }

        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .kpi-card { background: var(--card); border: 1px solid rgba(255,255,255,0.07); padding: 18px; border-radius: 10px; position: relative; overflow: hidden; }
        .kpi-card::after { content: ''; position: absolute; top: 0; right: 0; width: 4px; height: 100%; background: var(--gold); }
        .kpi-title { color: #aaa; font-size: 0.9em; margin-bottom: 6px; }
        .kpi-value { font-size: 2em; font-weight: bold; color: #fff; }
        .kpi-sub { font-size: 0.8em; color: var(--gold); margin-top: 4px; }

        .panels-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .panel-box { background: var(--card); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 18px; }
        .panel-box h3 { color: var(--gold); font-size: 1.15em; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; font-family: 'Amiri', serif; }

        .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.95em; }
        .badge-count { background: rgba(212,175,55,0.15); color: var(--gold-light); border: 1px solid rgba(212,175,55,0.35); padding: 2px 10px; border-radius: 20px; font-weight: bold; font-size: 0.85em; }

        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; font-size: 0.9em; }
        th { background: #1a1a1a; color: var(--gold); padding: 11px 10px; border-bottom: 1px solid #333; white-space: nowrap; }
        td { padding: 10px; border-bottom: 1px solid #1e1e1e; color: #ddd; }
        tr:hover td { background: rgba(212,175,55,0.04); }
        @media(max-width: 768px) { .panels-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div class="header-title">
            <h1><span class="live-dot"></span> رادار الإحصائيات (Cloudflare Worker)</h1>
        </div>
        <div class="btn-group">
            <button class="btn-action" onclick="fetchWorkerData()"><i class="fas fa-sync-alt"></i> تحديث مباشر</button>
            <a href="index.html" class="btn-action"><i class="fas fa-store"></i> عرض المتجر</a>
        </div>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-title">إجمالي الزوار 👥</div>
            <div class="kpi-value" id="kpiVisitors">0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">فحص القطع 🔍</div>
            <div class="kpi-value" id="kpiProductViews">0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">إضافة للسلة 🛍️</div>
            <div class="kpi-value" id="kpiCartAdds">0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">الطلبيات المؤكدة 💎</div>
            <div class="kpi-value" id="kpiPurchases" style="color:#2ecc71;">0</div>
            <div class="kpi-sub" id="kpiRevenue">0 د.ج إجمالي المبيعات</div>
        </div>
    </div>

    <div class="panel-box" style="margin-bottom: 25px; border-color: rgba(46, 204, 113, 0.35);">
        <h3>📦 سجل الطلبيات المؤكدة</h3>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>التوقيت</th>
                        <th>الزبون والهاتف</th>
                        <th>المنتجات والكمية</th>
                        <th>الولاية والعنوان</th>
                        <th>المبلغ</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr><td colspan="5" style="text-align:center; color:#777; padding:20px;">جاري جلب الطلبيات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="panels-grid">
        <div class="panel-box">
            <h3>🔥 أكثر المنتجات تفاعلاً</h3>
            <div id="topProductsList"></div>
        </div>
        <div class="panel-box">
            <h3>📲 مصادر الزوار</h3>
            <div id="trafficSourcesList"></div>
        </div>
    </div>
</div>

<script>
    const CLOUDFLARE_WORKER_FETCH_URL = "https://glame-tracker.warriorlegend3160.workers.dev/";

    async function fetchWorkerData() {
        try {
            const res = await fetch(CLOUDFLARE_WORKER_FETCH_URL);
            if (res.ok) {
                const events = await res.json();
                if (Array.isArray(events)) {
                    renderDashboard(events);
                }
            }
        } catch(e) {}
    }

    function renderDashboard(events) {
        const visits = events.filter(e => e.type === 'visit');
        const views = events.filter(e => e.type === 'product_view');
        const carts = events.filter(e => e.type === 'add_to_cart' || e.type === 'initiate_order');
        const purchases = events.filter(e => e.type === 'purchase');

        document.getElementById('kpiVisitors').innerText = new Set(events.map(e => e.sid)).size || visits.length;
        document.getElementById('kpiProductViews').innerText = views.length;
        document.getElementById('kpiCartAdds').innerText = carts.length;
        document.getElementById('kpiPurchases').innerText = purchases.length;

        const totalRev = purchases.reduce((sum, p) => sum + (Number(p.price) || 0), 0);
        document.getElementById('kpiRevenue').innerText = `${totalRev.toLocaleString()} د.ج إجمالي المبيعات`;

        const ordersBody = document.getElementById('ordersTableBody');
        if (purchases.length === 0) {
            ordersBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#777; padding:20px;">لا توجد طلبيات مسجلة حتى الآن.</td></tr>`;
        } else {
            ordersBody.innerHTML = purchases.map(p => {
                const timeStr = new Date(p.ts).toLocaleString('ar-DZ', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
                let ex = {};
                try { ex = typeof p.extra === 'string' ? JSON.parse(p.extra) : (p.extra || {}); } catch(err) {}
                
                const customerInfo = ex.name ? `<b>${ex.name}</b><br><a href="tel:${ex.phone}" style="color:var(--gold); text-decoration:none;">📞 ${ex.phone}</a>` : 'طلب مؤكد';
                const locationInfo = `${p.wilaya || ''}<br><span style="color:#aaa; font-size:0.85em;">${ex.commune || ''} - ${ex.address || ''}</span>`;
                return `
                    <tr>
                        <td style="white-space:nowrap;">${timeStr}</td>
                        <td>${customerInfo}</td>
                        <td style="color:var(--gold-light); font-weight:bold;">${p.item}</td>
                        <td>${locationInfo}</td>
                        <td style="color:#2ecc71; font-weight:bold; white-space:nowrap;">${ex.total || (p.price + ' د.ج')}</td>
                    </tr>
                `;
            }).join('');
        }

        const prodCounts = {};
        views.forEach(v => { prodCounts[v.item] = (prodCounts[v.item] || 0) + 1; });
        const sortedProds = Object.entries(prodCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);
        document.getElementById('topProductsList').innerHTML = sortedProds.length ? sortedProds.map(([name, count]) => `
            <div class="stat-row">
                <span>💎 ${name}</span>
                <span class="badge-count">${count} معاينة</span>
            </div>
        `).join('') : '<p style="color:#666; text-align:center; padding:15px;">لا توجد معاينات بعد</p>';

        const srcCounts = {};
        events.forEach(e => {
            const s = e.source || 'دخول مباشر 🔍';
            srcCounts[s] = (srcCounts[s] || 0) + 1;
        });
        const sortedSrcs = Object.entries(srcCounts).sort((a, b) => b[1] - a[1]);
        document.getElementById('trafficSourcesList').innerHTML = sortedSrcs.length ? sortedSrcs.map(([src, count]) => `
            <div class="stat-row">
                <span>${src}</span>
                <span class="badge-count">${count} حركة</span>
            </div>
        `).join('') : '<p style="color:#666; text-align:center; padding:15px;">لا توجد بيانات بعد</p>';
    }

    window.addEventListener('DOMContentLoaded', () => {
        fetchWorkerData();
        setInterval(fetchWorkerData, 6000);
    });
</script>
</body>
</html>
